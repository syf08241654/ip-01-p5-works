<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="宋一凡">
<title>ip-01-p5-works · 交互编程作业一</title>
<style>
  :root {
    --sky: #F6EFE3;   /* 米色 */
    --sun: #E2572B;   /* 暖橙红 */
    --near: #2B4C6F;  /* 深蓝 */
    --mid: #41729F;   /* 中蓝 */
    --far: #88B0CC;   /* 浅蓝 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--sky);
    color: var(--near);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 24px;
  }
  header { text-align: center; margin-bottom: 48px; }
  header h1 { font-size: 30px; letter-spacing: 2px; }
  header p { margin-top: 10px; font-size: 13px; letter-spacing: 3px; opacity: .6; }
  main { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .card {
    display: block;
    width: 320px;
    padding: 30px 28px;
    background: #fff;
    border-radius: 16px;
    text-decoration: none;
    color: var(--near);
    border-bottom: 6px solid var(--mid);
    box-shadow: 0 12px 30px -14px rgba(43, 76, 111, .35);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -16px rgba(43, 76, 111, .45); }
  .card.warm { border-bottom-color: var(--sun); }
  .tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--far);
    color: #fff;
    margin-bottom: 14px;
  }
  .card.warm .tag { background: var(--sun); }
  .card h2 { font-size: 22px; margin-bottom: 10px; }
  .card p { font-size: 13px; line-height: 1.8; opacity: .75; }
  footer { margin-top: 56px; font-size: 12px; letter-spacing: 2px; opacity: .5; }
</style>
</head>
<body>
  <header>
    <h1>创意代码 · p5.js 作品集</h1>
    <p>IP-01-P5-WORKS · 交互编程作业一 · 宋一凡</p>
  </header>

  <main>
    <a class="card warm" href="static.html">
      <span class="tag">作业 1-A · 静态</span>
      <h2>《暖阳 · 群山》</h2>
      <p>几何构成 —— 只用形状、颜色、位置作画，不含 draw() 循环；冷暖对比，太阳为视觉中心。</p>
    </a>
    <a class="card" href="dynamic.html">
      <span class="tag">作业 1-B · 交互</span>
      <h2>《引力花园》</h2>
      <p>交互动态 —— draw() 驱动的粒子引力场，四种交互：鼠标移动、点击冲击波、空格切换模式、时间变化。</p>
    </a>
  </main>

  <footer>宋一凡 · 技术 p5.js 1.9.4 · 部署 GitHub Pages</footer>
</body>
</html>
