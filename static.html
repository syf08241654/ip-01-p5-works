<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="宋一凡">
<title>作品 1-A · 暖阳群山（静态几何构成）· 宋一凡</title>
<style>
  /* 去掉默认边距与滚动条，保证画布铺满不出现滚动条错位 */
  html, body { margin: 0; padding: 0; overflow: hidden; }
  canvas { display: block; }
</style>
<!-- p5.js 1.9.4（CDN 引入） -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>
<script>
/*
 * 《暖阳 · 群山》 —— 静态几何构成
 * 作者：宋一凡（GitHub: songyifan）
 *
 * 构图思路：
 *   暖橙红的太阳放在画面黄金分割点（偏右上），是全画唯一的暖色块，
 *   天然的视觉中心；三层冷蓝群山由浅到深、由高到低依次后退，
 *   形成冷暖对比与纵深节奏；前景用 for 循环画出一排草叶收束视线。
 *
 * 配色意图（全画共 5 色）：
 *   米色天空作统一基调；太阳暖橙红与群山冷蓝形成冷暖对比；
 *   三层蓝山取同色系深浅变化，保证画面统一。
 *
 * 技术约束：只有 setup()，没有 draw() 循环；
 *           山体轮廓与草叶均用 for 循环生成，不逐个手写。
 */

// ---------- 配色（共 5 色） ----------
const COLOR_SKY  = '#F6EFE3';  // 米色 · 天空（统一基调）
const COLOR_SUN  = '#E2572B';  // 暖橙红 · 太阳（视觉中心，暖）
const COLOR_FAR  = '#88B0CC';  // 浅蓝 · 远山（冷，退后）
const COLOR_MID  = '#41729F';  // 中蓝 · 中山
const COLOR_NEAR = '#2B4C6F';  // 深蓝 · 近山（冷，靠前）

function setup() {
  createCanvas(windowWidth, windowHeight);
  renderComposition();               // 只画一次，没有 draw() 循环
}

// 窗口尺寸变化时重绘一遍，保持画布始终铺满、无滚动条
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  renderComposition();
}

// ---------- 整幅构图 ----------
function renderComposition() {
  drawSky();
  drawSun();
  drawMountainRange(COLOR_FAR,  height * 0.56, height * 0.10, 0.9);  // 远山：矮而浅
  drawMountainRange(COLOR_MID,  height * 0.70, height * 0.13, 1.4);  // 中山
  drawMountainRange(COLOR_NEAR, height * 0.85, height * 0.09, 2.1);  // 近山：深而靠前
  drawReeds();
}

// 1. 天空
function drawSky() {
  noStroke();
  background(COLOR_SKY);
}

// 2. 太阳：实心圆 + 两圈同色低透明度光环（不引入新颜色）
function drawSun() {
  const sunX = width * 0.64;                       // 黄金分割点附近
  const sunY = height * 0.32;
  const sunR = min(width, height) * 0.16;

  fill(COLOR_SUN);
  noStroke();
  circle(sunX, sunY, sunR * 2);

  // 光环：同一颜色 + 透明度，制造层次
  noFill();
  stroke(COLOR_SUN + '44');
  strokeWeight(6);
  circle(sunX, sunY, sunR * 2.7);
  stroke(COLOR_SUN + '22');
  circle(sunX, sunY, sunR * 3.6);
  noStroke();
}

// 3. 一层山：for 循环沿横向取 14 个采样点，用正弦叠加生成固定起伏轮廓
//    （用确定性的正弦函数而不是 random，保证每次打开形状一致、稳定不乱跑）
function drawMountainRange(mountainColor, baseY, amp, phaseSeed) {
  fill(mountainColor);
  beginShape();
  vertex(0, height);          // 左下角
  vertex(0, baseY);           // 左侧山脚

  const steps = 14;           // 横向采样点数量
  for (let i = 0; i <= steps; i++) {
    const x = (width / steps) * i;
    // 两组正弦波叠加出"大起伏 + 小锯齿"的山脊线
    const bigWave   = sin(i * 1.3 + phaseSeed) * 0.6;
    const smallWave = sin(i * 2.7 + phaseSeed * 2) * 0.4;
    vertex(x, baseY - abs(bigWave + smallWave) * amp);
  }

  vertex(width, baseY);       // 右侧山脚
  vertex(width, height);      // 右下角
  endShape(CLOSE);
}

// 4. 前景草叶：for 循环等距排布一排短线，高度随正弦起伏，形成重复节奏
function drawReeds() {
  stroke(COLOR_SKY);          // 米色草叶画在深蓝近山上，剪影清晰
  strokeWeight(2);
  const gap = 26;             // 草叶间距
  for (let x = gap / 2; x < width; x += gap) {
    const bladeHeight = 34 + 26 * sin(x * 0.02);
    line(x, height, x, height - bladeHeight);
  }
  noStroke();
}
</script>
</body>
</html>
